<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 340px; margin: 0; padding: 14px; font-family: sans-serif; font-size: 13px; }
      h2 { margin: 0 0 10px; font-size: 16px; }
      label { display: block; margin: 8px 0 3px; font-size: 12px; color: #555; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
      textarea { height: 90px; resize: vertical; }
      button { margin-top: 12px; padding: 8px 14px; cursor: pointer; }
      #status { margin-top: 10px; font-size: 12px; }
      .error { color: #c62828; }
      .ok { color: #2e7d32; }
    </style>
  </head>
  <body>
    <h2>Clip scholarship</h2>

    <label>Name</label>
    <input id="name" />

    <label>Provider</label>
    <input id="provider" />

    <label>Award amount ($)</label>
    <input id="amount" type="number" />

    <label>Deadline</label>
    <input id="deadline" type="date" />

    <label>Eligibility / requirements</label>
    <textarea id="requirements"></textarea>

    <label>Link</label>
    <input id="link" />

    <button id="save">Save to tracker</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
